<!DOCTYPE html>
<html>
<head>
<title>I'm Sorry Madina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
font-family:Arial;
}
.card{
background:rgba(255,255,255,0.3);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
text-align:center;
width:90%;
max-width:400px;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
}
h1{color:#b00020;}
p{color:#222;line-height:1.6;}
.heart{
font-size:45px;
animation:beat 1.5s infinite;
}
@keyframes beat{
0%,100%{transform:scale(1);}
50%{transform:scale(1.2);}
}
</style>
</head>

<body>

<audio autoplay loop>
<source src="https://files.catbox.moe/3n0b7g.mp3" type="audio/mpeg">
</audio>

<div class="card">
<div class="heart">💔</div>
<h1>I'm Sorry, Madina</h1>
<p>
I know I hurt you.<br><br>
This isn’t an excuse, just my heart speaking.
Losing you made me realize what I took for granted.<br><br>
I don’t know if you’ll forgive me,
but I needed you to know that
I truly regret everything.
</p>
<p><b>– Satyam</b></p>
</div>

</body>
</html>
